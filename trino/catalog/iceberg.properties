connector.name=iceberg
iceberg.catalog.type=rest

# Point Metadata to our Central Proxy (Metadata Interceptor)
# The proxy will forward to Nessie and inject STS credentials
iceberg.rest-catalog.uri=http://central-proxy:8081/iceberg

# Enable Vended Credentials
# This tells Trino to accept the STS credentials we inject into LoadTable responses
iceberg.rest-catalog.vended-credentials-enabled=true

# S3 Configuration - Point to our Central Proxy (Virtual S3 Gateway)
# The proxy will route requests to the appropriate hospital MinIO
fs.native-s3.enabled=true
s3.endpoint=http://central-proxy:8081/s3
s3.path-style-access=true
s3.region=us-east-1

# These are placeholder values - actual credentials come from vended credentials
# s3.aws-access-key=placeholder
# s3.aws-secret-key=placeholder
