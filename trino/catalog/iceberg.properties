connector.name=iceberg
iceberg.catalog.type=rest

# Metadata goes to central-proxy, which implements the Iceberg REST catalog on
# top of Nessie and injects per grant STS credentials into LoadTable responses.
iceberg.rest-catalog.uri=http://central-proxy:8081/iceberg
# Deployed proxy instead of the local one:
# iceberg.rest-catalog.uri=https://central-proxy-8246454bb93c.herokuapp.com/iceberg

# Accept the STS credentials the proxy returns with the table metadata.
iceberg.rest-catalog.vended-credentials-enabled=true

# Object reads go to the proxy's virtual S3 gateway, which routes and presigns
# them against the correct hospital MinIO.
fs.native-s3.enabled=true
s3.endpoint=http://central-proxy:8081/s3
# Deployed proxy instead of the local one:
# s3.endpoint=https://central-proxy-8246454bb93c.herokuapp.com/s3
s3.path-style-access=true
s3.region=us-east-1

# No static credentials here on purpose. They arrive per query as vended credentials.
