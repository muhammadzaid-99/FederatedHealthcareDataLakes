  #     RABBITMQ_PORT: 5672
  #     RABBITMQ_USER: guest
  #     RABBITMQ_PASSWORD: guest
  #     NESSIE_ENDPOINT: http://nessie:19120
  #     NESSIE_DEFAULT_BRANCH: main
  #     APP_PORT: 8080
  #     APP_ENV: development
  #     JWT_SECRET: dev-secret-key-change-in-production
  #     JWT_EXPIRATION_HOURS: 24
  #     ADMIN_USERNAME: admin
  #     ADMIN_PASSWORD: admin123
  #     LOG_LEVEL: info
  #     LOG_FORMAT: json
  #     # Proxy settings (central-backend -> central-proxy)
  #     PROXY_URL: http://central-proxy:8081
  #     PROXY_INTERNAL_API_KEY: dev-internal-api-key-change-in-production
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres-central:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     nessie:
  #       condition: service_healthy
  #   networks:
  #     - central-network
