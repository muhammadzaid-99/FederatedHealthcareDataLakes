  # Node Backend (Middleware for Hospital Nodes)
  # node-backend:
  #   build:
  #     context: ./node-backend
  #     dockerfile: Dockerfile
  #   container_name: node-backend-app
  #   environment:
  #     NODE_PORT: 9090
  #     NODE_ENV: development
  #     NODE_DB_HOST: postgres-node
  #     NODE_DB_PORT: 5432
  #     NODE_DB_USER: node_user
  #     NODE_DB_PASSWORD: node_password
  #     NODE_DB_NAME: node_db
  #     NODE_DB_SSLMODE: disable
  #     CENTRAL_BACKEND_URL: http://central-backend:8080
  #     NODE_JWT_SECRET: node-jwt-secret-change-in-production
  #   ports:
  #     - "9090:9090"
  #   depends_on:
  #     postgres-node:
  #       condition: service_healthy
  #     central-backend:
  #       condition: service_started
  #   networks:
  #     - central-network
  #   restart: unless-stopped

  # Central Web (Admin Portal Frontend)
  # central-web:
  #   build:
  #     context: ./central-web
  #     dockerfile: Dockerfile
  #   container_name: central-web-app
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://central-backend:8080
  #     NODE_ENV: production
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - central-backend
  #   networks:
  #     - central-network
  #   restart: unless-stopped

  # Node Web (Hospital Node Portal Frontend)
  # node-web:
  #   build:
  #     context: ./node-web
  #     dockerfile: Dockerfile
  #   container_name: node-web-app
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://central-backend:8080
  #     NODE_ENV: production
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     - central-backend
  #   networks:
  #     - central-network
  #   restart: unless-stopped

  # Central Proxy - Virtual S3 Gateway and Metadata Interceptor
  central-proxy:
    build:
      context: ./central-proxy
      dockerfile: Dockerfile
    container_name: central-proxy
    environment:
      PROXY_PORT: 8081
      PROXY_ENV: development
      LOG_LEVEL: debug
      # Connect to central-backend's PostgreSQL (read-only access)
      DB_HOST: postgres-central
      DB_PORT: 5432
      DB_NAME: centraldb
      DB_USER: central
      DB_PASSWORD: centralpass
      DB_SSL_MODE: disable
      # Nessie endpoint for metadata proxying
      NESSIE_ENDPOINT: http://nessie:19120
      # Internal API key for service-to-service auth
      INTERNAL_API_KEY: dev-internal-api-key-change-in-production
      # Cache settings
      CACHE_CREDENTIAL_TTL: 300
      CACHE_HOSPITAL_TTL: 600
    ports:
      - "8081:8081"
    depends_on:
      postgres-central:
        condition: service_healthy
      nessie:
        condition: service_healthy
    networks:
      - central-network
    restart: unless-stopped

  # Trino - Distributed SQL Query Engine for Iceberg
  trino:
    image: trinodb/trino:464
    container_name: trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/etc:/etc/trino/etc:ro
    environment:
      # Java memory settings
      JAVA_TOOL_OPTIONS: "-Xmx2G"
    depends_on:
      - central-proxy
      - nessie
    networks:
      - central-network
    restart: unless-stopped

volumes:
  postgres_data:
  nessie_postgres_data:
  node_postgres_data:
  rabbitmq_data:

networks:
  central-network:
    driver: bridge
