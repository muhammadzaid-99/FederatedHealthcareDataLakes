services:
  # PostgreSQL Database
  postgres-central:
    image: postgres:latest
    container_name: central-postgres
    environment:
      POSTGRES_DB: centraldb
      POSTGRES_USER: central
      POSTGRES_PASSWORD: centralpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d centraldb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - central-network

  # PostgreSQL Database for Nessie
  postgres-nessie:
    image: postgres:latest
    container_name: nessie-postgres
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessiepass
    ports:
      - "5433:5432"  # Using different port to avoid conflict
    volumes:
      - nessie_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - central-network

  # PostgreSQL Database for Node Backend
  postgres-node:
    image: postgres:latest
    container_name: node-postgres
    environment:
      POSTGRES_DB: node_db
      POSTGRES_USER: node_user
      POSTGRES_PASSWORD: node_password
    ports:
      - "5434:5432"  # Using different port to avoid conflict
    volumes:
      - node_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U node_user -d node_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - central-network

  # RabbitMQ Message Broker
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: central-rabbitmq
  #   hostname: central-rabbitmq
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest
  #     RABBITMQ_ERLANG_COOKIE: 'SWQOKODSQALRPCLNMEQG'
  #   ports:
  #     - "5672:5672"   # AMQP port
  #     - "15672:15672" # Management UI
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - central-network

  # Project Nessie - Git-like Version Control for Data Lakes
  # NOTE: We use Nessie ONLY as a metadata version control system (Git API).
  # The Iceberg REST Catalog functionality is handled by central-proxy.
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: central-nessie
    environment:
      QUARKUS_HTTP_PORT: 19120
      # Use PostgreSQL instead of in-memory storage
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-nessie:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessiepass
      # NO Iceberg Catalog config - central-proxy handles Iceberg REST
    ports:
      - "19120:19120"
    depends_on:
      postgres-nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - central-network

  # Central Control Plane Application (Backend)
  # central-backend:
  #   build:
  #     context: ./central-backend
  #     dockerfile: Dockerfile
  #   container_name: central-backend-app
  #   environment:
