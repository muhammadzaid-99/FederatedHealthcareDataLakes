# ==============================================================================
# Cloudflare Tunnel Config
#
# Routes 4 subdomains to local Docker services through a single tunnel.
# Replace YOURDOMAIN with your actual .tech domain.
#
# This file is used by: cloudflared tunnel run
# Location: copy to ~/.cloudflared/config.yml after tunnel creation
# ==============================================================================

tunnel: REDACTED-TUNNEL-ID
credentials-file: /home/muhammad-zaid/.cloudflared/REDACTED-TUNNEL-ID.json

# Force HTTP/2 (TCP) instead of QUIC (UDP) — QUIC is blocked on some networks
protocol: http2

# Force IPv4 only — IPv6 fails with permission denied (GID not in ping_group_range)
edge-ip-version: "4"

# Grace period before cloudflared exits on shutdown (prevents request drops)
grace-period: 30s

# Reduce log noise from retries
# loglevel: warn

ingress:
  - hostname: minio-h1.healthlake.tech
    service: http://localhost:9000

  - hostname: minio-h1-view.healthlake.tech
    service: http://localhost:9001

  - hostname: nessie.healthlake.tech
    service: http://localhost:19120

  - hostname: trino.healthlake.tech
    service: http://localhost:8082

  - hostname: etl-h1.healthlake.tech
    service: http://localhost:9091

  # Catch-all (required by cloudflared)
  - service: http_status:404


# cloudflared tunnel route dns hms-local minio-h1.healthlake.tech
# cloudflared tunnel route dns hms-local minio-h1-view.healthlake.tech
# cloudflared tunnel route dns hms-local nessie.healthlake.tech
# cloudflared tunnel route dns hms-local trino.healthlake.tech
# cloudflared tunnel route dns hms-local etl-h1.healthlake.tech