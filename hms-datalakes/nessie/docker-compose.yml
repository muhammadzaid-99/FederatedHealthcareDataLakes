services:
  postgres:
    image: postgres
    container_name: nessie-postgres
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie123
    ports:
      - "5433:5432"
    volumes:
      - pg_nessie:/var/lib/postgresql/data
    networks:
      - nessie-network

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie-server
    depends_on:
      - postgres
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessie123
      NESSIE_VERSION_STORE_TYPE: JDBC
    ports:
      - "19120:19120"
    networks:
      - nessie-network

volumes:
  pg_nessie:

networks:
  nessie-network:
    driver: bridge