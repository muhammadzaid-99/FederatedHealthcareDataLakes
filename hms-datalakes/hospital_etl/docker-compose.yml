services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5


  minio-client:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 admin admin12345) do echo '...waiting...' && sleep 1; done;
      mc admin policy create local etl-policy ./policies/etl-user.json &&
      mc admin user add local etluser etlpass123 &&
      mc admin policy attach local etl-policy --user etluser;
      mc mb local/hospital-data;
      mc cp ./init-folders.sh /tmp/init.sh &&
      sh /tmp/init.sh
      "
    volumes:
      - ./policies:/policies
      - ./init-folders.sh:/init-folders.sh

  pg:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: hms
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
